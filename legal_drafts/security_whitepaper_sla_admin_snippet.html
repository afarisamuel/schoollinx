<h2>1. Zero-Trust Cloud Architecture</h2>
<p>SchoolLinx is engineered on a Zero-Trust security paradigm. Every API interaction is authenticated, authorized, and logged with millisecond granularity across edge firewalls, Go micro-engines, and PostgreSQL schema-isolated storage nodes.</p>

<hr />

<h2>2. Multi-Tenant Relational Schema Isolation</h2>
<ul>
  <li><strong>Schema Partitioning:</strong> Each school operates in a dedicated database schema. No shared tables exist for sensitive student and financial records.</li>
  <li><strong>Connection Pinning:</strong> Queries dynamically set the PostgreSQL search path per tenant, preventing accidental cross-table bleeding.</li>
  <li><strong>Field-Level Encryption:</strong> Sensitive identifiers (such as national IDs and emergency contact PINs) are encrypted using AES-GCM-256 before disk writes.</li>
</ul>

<hr />

<h2>3. Disaster Recovery &amp; Availability Metrics</h2>
<ul>
  <li><strong>Monthly Uptime SLA:</strong> 99.99% guaranteed service availability.</li>
  <li><strong>Recovery Point Objective (RPO):</strong> &lt; 5 minutes of transactional data.</li>
  <li><strong>Recovery Time Objective (RTO):</strong> &lt; 15 minutes for complete node reconstruction.</li>
  <li><strong>Automated Hourly Snapshots:</strong> Encrypted backups mirrored across 3 availability zones.</li>
</ul>

<hr />

<h2>4. Incident Response Escalation Tiers</h2>
<ul>
  <li><strong>P1 - Critical Outage:</strong> &lt; 15 minute 24/7 engineer response time.</li>
  <li><strong>P2 - Major Feature Issue:</strong> &lt; 2 hours response time.</li>
  <li><strong>P3 - General Configuration:</strong> &lt; 24 hours response time.</li>
</ul>

<hr />

<h2>5. Vulnerability Management &amp; Penetration Testing</h2>
<ul>
  <li>Continuous SAST/DAST scanning across all deployment pipelines.</li>
  <li>Annual third-party penetration testing by CREST-accredited security auditors.</li>
  <li>Bug bounty vulnerability disclosure program for ethical researchers.</li>
</ul>
</textarea>
