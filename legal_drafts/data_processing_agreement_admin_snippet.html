<div class="container">
  <div class="header">
    <div>
      <span class="badge">Compliance Addendum</span>

    <button class="copy-btn" onclick="copySnippet()">Copy HTML Snippet</button>
  </div>

  <div class="meta-box">
    <span><strong>Title:</strong> Data Processing Addendum (GDPR / DPA)</span>
    <span><strong>Slug:</strong> <code>data-processing-agreement</code></span>

  </div>

  <label style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: #94a3b8;">Clean HTML for Admin Editor:</label>
  <textarea id="snippetArea" readonly>
<h2>1. Data Processing Agreement &amp; Controller-Processor Roles</h2>
<p>This Data Processing Addendum ("DPA") supplements the Institutional SaaS Agreement. Under this Addendum, the educational institution acts as the <strong>Data Controller</strong>, and SchoolLinx acts exclusively as the <strong>Data Processor</strong>.</p>

<hr />

<h2>2. Scope and Nature of Processing</h2>
<p>The Processor processes student and institutional records exclusively under written instructions from the School for the following operations:</p>
<ul>
  <li>Maintaining pupil registry, attendance timestamps, continuous assessments, and terminal report cards.</li>
  <li>Executing automated tuition fee recovery and receipting.</li>
  <li>Transmitting multi-carrier SMS and email alerts upon school authorization.</li>
  <li>Maintaining verifiable transcript cryptographic hashes.</li>
</ul>

<hr />

<h2>3. Authorized Sub-Processors</h2>
<ul>
  <li><strong>Cloud Hosting &amp; Edge Security:</strong> AWS / Cloudflare (ISO 27001 &amp; SOC 2 certified datacenters).</li>
  <li><strong>Tuition Payment Gateway:</strong> Paystack Payments (PCI-DSS Level 1 certified).</li>
  <li><strong>Telecommunications Infrastructure:</strong> Direct telecommunications carrier interconnects.</li>
</ul>

<hr />

<h2>4. Technical &amp; Organizational Measures (TOMs)</h2>
<ul>
  <li><strong>Schema Partitioning:</strong> Relational database segregation per school schema.</li>
  <li><strong>AES-256 Encryption:</strong> CMEK field-level and volume-level cloud encryption.</li>
  <li><strong>Granular Role Permissions:</strong> Strict separation of bursar, faculty, and student access.</li>
  <li><strong>Breach Notification:</strong> Written notice to school administration within 48 hours of any confirmed security event.</li>
</ul>

<hr />

<h2>5. Data Return &amp; Sanitization</h2>
<p>Upon contract termination, the Processor exports all student records in structured JSON/CSV format and purges database schemas using DoD 5220.22-M sanitization standards within 30 days.</p>
</textarea>

  <h3 style="margin-top: 30px; font-size: 15px; color: #94a3b8;">Rendered Preview:</h3>
  <div class="preview-box" id="previewBox"></div>
</div>

<script>
  const snippet = document.getElementById('snippetArea').value;
  document.getElementById('previewBox').innerHTML = snippet;

  function copySnippet() {
    navigator.clipboard.writeText(snippet);
    alert('DPA HTML snippet copied to clipboard!');
  }
</script>
