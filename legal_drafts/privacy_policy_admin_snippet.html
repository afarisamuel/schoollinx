<h2>1. Executive Summary &amp; Commitment to Data Isolation</h2>
<p>SchoolLinx operates on a <strong>dedicated tenant schema isolation architecture</strong>. Unlike traditional single-database platforms, your institution's records (including biometric data, student grades, fee ledgers, and guardian contact details) are cryptographically and logically segregated in independent database namespaces.</p>
<p>We do <strong>not</strong> sell, rent, monetize, or harvest student or institutional data under any circumstance.</p>

<hr />

<h2>2. Information We Collect and Process</h2>
<ul>
  <li><strong>Institutional Identity &amp; Credentials:</strong> School administrative contact details, authorized domain names, accreditation identifiers, and billing credentials.</li>
  <li><strong>Academic &amp; Operational Records:</strong> Student enrollments, class rosters, attendance timestamps, continuous assessments, examination marks, and report cards.</li>
  <li><strong>Financial &amp; Payment Metadata:</strong> Paystack transaction references, fee structure schedules, and receipt records. (Credit card and banking PINs are processed directly by PCI-DSS Level 1 certified gateways and never stored on our servers).</li>
  <li><strong>Communication Logs:</strong> Multi-carrier SMS transmission payloads, delivery receipts, emergency broadcast logs, and in-app notices.</li>
  <li><strong>Technical &amp; Security Telemetry:</strong> Session tokens, IP access logs, device fingerprints, and rate-limit audit records for unauthorized access detection.</li>
</ul>

<hr />

<h2>3. Biometric &amp; Guardian Pickup Verification</h2>
<p>For institutions utilizing biometric time-clocks or QR pickup verification:</p>
<ul>
  <li>Biometric templates are converted on-device to unidirectional irreversible cryptographic hashes. Raw fingerprint or facial imagery is never retained in cloud storage.</li>
  <li>Pickup codes generated for guardians expire automatically upon verification and are permanently recorded in immutable audit logs.</li>
</ul>

<hr />

<h2>4. Dedicated Tenant Isolation &amp; Database Security</h2>
<p>Every school onboarded to SchoolLinx receives an isolated PostgreSQL schema:</p>
<ul>
  <li><strong>AES-256 Cloud Encryption:</strong> All data at rest is encrypted using customer-managed encryption keys (CMEK).</li>
  <li><strong>TLS 1.3 in Transit:</strong> All data in flight across web sockets, public APIs, and administrative dashboards enforces TLS 1.3 with HSTS.</li>
  <li><strong>Row-Level &amp; Schema-Level Access Controls:</strong> Cross-tenant queries are prevented by architectural barriers at the database engine level.</li>
</ul>

<hr />

<h2>5. Data Retention, Portability &amp; Right to Erasure</h2>
<ul>
  <li><strong>Data Ownership:</strong> The school retains full, unrestricted ownership of all student, parent, and institutional data.</li>
  <li><strong>One-Click Export:</strong> SuperAdmins and School Principals can generate standardized JSON/CSV/PDF database archives at any time.</li>
  <li><strong>Right to Erasure:</strong> Upon contract termination or verified GDPR/DPA request, tenant schemas are securely purged in accordance with DoD 5220.22-M sanitization standards within 30 days.</li>
</ul>

<hr />

<h2>6. Contact Our Data Protection Officer</h2>
<p>For privacy inquiries, audit verification, or data subject access requests:</p>
<ul>
  <li><strong>Email:</strong> privacy@schoollinx.com | dpo@schoollinx.com</li>
  <li><strong>Legal Desk:</strong> Data Governance Team, SchoolLinx Inc.</li>
</ul>
</textarea>
