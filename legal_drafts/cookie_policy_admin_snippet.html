<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Snippet: Cookie Policy</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 30px; }
    .container { max-width: 900px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 20px; }
    .badge { background: rgba(13,148,136,0.2); color: #2dd4bf; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    .meta-box { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; }
    .meta-box span { color: #94a3b8; margin-right: 20px; }
    .meta-box strong { color: #f8fafc; }
    .copy-btn { background: #0d9488; color: white; border: none; padding: 10px 20px; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .copy-btn:hover { background: #0f766e; }
    textarea { width: 100%; height: 350px; background: #090e1a; color: #38bdf8; font-family: monospace; font-size: 13px; padding: 15px; border: 1px solid #334155; border-radius: 8px; box-sizing: border-box; resize: vertical; }

<body>

<div class="container">
  <div class="header">
    <div>
      <span class="badge">Privacy &amp; Compliance</span>
      <h2 style="margin: 8px 0 0; color: #fff;">Cookie &amp; Tracking Policy</h2>
    </div>
    <button class="copy-btn" onclick="copySnippet()">Copy HTML Snippet</button>
  </div>

  <div class="meta-box">
    <span><strong>Title:</strong> Cookie &amp; Tracking Technology Policy</span>
    <span><strong>Slug:</strong> <code>cookie-policy</code></span>
    <span><strong>Category:</strong> Privacy &amp; Compliance</span>
    <span><strong>Version:</strong> <code>1.5</code></span>
  </div>

  <label style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: #94a3b8;">Clean HTML for Admin Editor:</label>
  <textarea id="snippetArea" readonly>
<h2>1. What Are Cookies and Local Storage?</h2>
<p>Cookies and local browser storage are small text files or key-value pairs stored on your device when you browse SchoolLinx portals. They are essential for maintaining authenticated sessions, saving appearance preferences, and preventing unauthorized cross-site attacks.</p>

<hr />

<h2>2. Categories of Cookies We Use</h2>

<h3>A. Strictly Necessary (Essential)</h3>
<p>These cookies and storage items are required for the platform to function securely. They cannot be disabled.</p>
<ul>
  <li><strong>schoollinx_token / jwt_session:</strong> Encrypted bearer authorization token used to authenticate your role-based API requests.</li>
  <li><strong>tenant_subdomain:</strong> Identifies the school schema for routing requests to the appropriate isolated database.</li>
  <li><strong>csrf_token:</strong> Prevents Cross-Site Request Forgery attacks.</li>
</ul>

<h3>B. Preference &amp; Interface Customization</h3>
<ul>
  <li><strong>theme_preference:</strong> Remembers light, dark, or system appearance mode.</li>
  <li><strong>sidebar_collapsed:</strong> Remembers administrative sidebar layout state.</li>
  <li><strong>schoollinx_cookie_consent:</strong> Records your cookie preferences and prevents repetitive prompts.</li>
</ul>

<h3>C. Operational Telemetry &amp; Error Tracking</h3>
<ul>
  <li><strong>slx_telemetry_id:</strong> Anonymous session identifier used exclusively to measure page load latencies, crash dumps, and API response health. Contains no student or personally identifiable information.</li>
</ul>

<hr />

<h2>3. Third-Party Cookies</h2>
<p>SchoolLinx does not host third-party advertising cookies, social media trackers, or retargeting pixels. Third-party interactions are strictly limited to secure payment gateway modal frames.</p>

<hr />

<h2>4. Managing Your Preferences</h2>
<p>You can adjust your cookie settings at any time using the cookie preferences modal or by modifying your browser's security settings.</p>
</textarea>

  <h3 style="margin-top: 30px; font-size: 15px; color: #94a3b8;">Rendered Preview:</h3>
  <div class="preview-box" id="previewBox"></div>
</div>

<script>
  const snippet = document.getElementById('snippetArea').value;
  document.getElementById('previewBox').innerHTML = snippet;

  function copySnippet() {
    navigator.clipboard.writeText(snippet);
    alert('Cookie Policy HTML snippet copied to clipboard!');
  }
</script>

</body>
</html>
