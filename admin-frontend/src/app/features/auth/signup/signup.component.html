<div class="min-h-screen bg-bg-primary text-text-primary flex items-center justify-center p-4 antialiased">
  <div class="w-full max-w-md animate-fade-in">
    <!-- Brand / Logo Area -->
    <div class="mb-10 text-center">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-accent-primary/20 border border-accent-primary/30 mb-4 shadow-lg shadow-accent-primary/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-accent-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-white">System Provisioning</h1>
      <p class="text-text-secondary mt-2">Initialize new administrative session</p>
    </div>

    <div class="bg-bg-secondary/50 backdrop-blur-2xl border border-border-primary rounded-radius-lg p-8 shadow-premium relative overflow-hidden">
      <!-- Decorative background blur -->
      <div class="absolute -top-24 -right-24 w-48 h-48 bg-accent-primary/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="relative z-10 space-y-6">
        @if (errorMessage) {
          <div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm flex items-start">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ errorMessage }}</span>
          </div>
        }

        <div>
          <label class="block text-sm font-medium text-text-secondary mb-2">Corporate Identity (Email)</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206" /></svg>
            </span>
            <input 
              type="email" 
              formControlName="email" 
              placeholder="admin@schoollinx.com"
              class="admin-input pl-12"
            >
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-text-secondary mb-2">System Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13.937 13.937 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0zm6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            </span>
            <input 
              type="text" 
              formControlName="username" 
              placeholder="ecopower_admin"
              class="admin-input pl-12"
            >
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-text-secondary mb-2">Secure Access Key</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
            </span>
            <input 
              type="password" 
              formControlName="password" 
              placeholder="••••••••"
              class="admin-input pl-12"
            >
          </div>
        </div>

        <button 
          type="submit" 
          [disabled]="signupForm.invalid || isSubmitting"
          class="admin-btn-primary w-full py-4 text-sm"
        >
          @if (!isSubmitting) {
            <span>Provision System Account</span>
          } @else {
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          }
        </button>

        <div class="text-center mt-6">
          <a href="/login" class="text-sm font-semibold text-accent-primary hover:text-accent-secondary transition-colors">
            Return to Authentication Session
          </a>
        </div>
      </form>
    </div>

    <p class="text-center mt-8 text-sm text-text-muted">
      Authorized System Personnel Only.
    </p>
  </div>
</div>
