<div class="flex h-screen bg-[#F4F6FB] dark:bg-bg-primary font-sans leading-relaxed text-slate-900 dark:text-text-primary overflow-hidden p-2 sm:p-2.5 md:p-3.5 gap-0 lg:gap-3.5 select-none">

  <!-- 1. Modular Sidebar Panel (Floating Card) -->
  <app-sidebar
    class="contents lg:flex lg:h-full lg:shrink-0"
    [isCollapsed]="isSidebarCollapsed()"
    [isMobileOpen]="isMobileSidebarOpen()"
    (toggleCollapse)="toggleSidebar()"
    (closeMobile)="closeMobileSidebar()"
    (openCommandPalette)="openCommandPalette()"
  ></app-sidebar>

  <!-- 2. Main Column (Navbar + Main Canvas) -->
  <div class="flex-1 flex flex-col min-w-0 h-full gap-2 sm:gap-3 md:gap-3.5 overflow-hidden">

    <!-- 3. Modular Floating Navbar Component -->
    <app-navbar
      class="shrink-0"
      [currentRouteTitle]="currentRouteTitle()"
      [canGoBack]="canGoBack()"
      (toggleSidebar)="toggleSidebar()"
      (goBack)="goBack()"
      (openCommandPalette)="openCommandPalette()"
    ></app-navbar>

    <!-- 4. Modular Main Page Canvas (Floating Card) -->
    <main class="flex-1 min-h-0 overflow-y-auto custom-scrollbar bg-[#F8FAFC] dark:bg-bg-secondary/40 rounded-xl sm:rounded-2xl md:rounded-3xl border border-slate-200/90 dark:border-border-primary/80 shadow-xs relative z-0 p-3 sm:p-5 md:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>

  <!-- Global Spotlight Search Command Palette (⌘K) -->
  <app-command-palette></app-command-palette>
</div>
