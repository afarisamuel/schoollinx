@if (isOpen()) {
  <div class="fixed inset-0 bg-black/75 backdrop-blur-md z-[100] flex items-start justify-center pt-20 p-4 animate-fade-in" (click)="close()">
    <div class="bg-bg-secondary border border-border-secondary rounded-2xl w-full max-w-xl shadow-2xl overflow-hidden animate-fade-in" (click)="$event.stopPropagation()">
      <!-- Search Input Header -->
      <div class="p-4 border-b border-border-primary flex items-center gap-3 bg-bg-tertiary/40">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-accent-primary shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>

        <input type="text"
               [(ngModel)]="query"
               placeholder="Type a command, page or school name..."
               autofocus
               class="w-full bg-transparent border-none text-sm text-white placeholder-text-muted focus:outline-none" />

        <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-bg-primary text-text-muted border border-border-primary">ESC</span>
      </div>

      <!-- Results List -->
      <div class="max-h-96 overflow-y-auto p-2 space-y-1 custom-scrollbar">
        @if (filteredCommands().length === 0) {
          <div class="p-8 text-center text-xs text-text-muted">
            No matching actions or institutions found for "<span class="text-white">{{ query() }}</span>"
          </div>
        } @else {
          @for (cmd of filteredCommands(); track cmd.id; let idx = $index) {
            <button (click)="cmd.action(); close()"
                    (mouseenter)="selectedIndex.set(idx)"
                    [class.bg-accent-primary/15]="selectedIndex() === idx"
                    [class.border-accent-primary/30]="selectedIndex() === idx"
                    class="w-full text-left p-3 rounded-xl border border-transparent hover:bg-bg-tertiary/40 transition-all flex items-center justify-between group">
              <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-lg bg-bg-primary border border-border-primary flex items-center justify-center text-text-muted group-hover:text-accent-primary shrink-0">
                  @if (cmd.category === 'TENANT') {
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                  } @else {
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                  }
                </div>
                <div>
                  <div class="text-xs font-bold text-white">{{ cmd.title }}</div>
                  <div class="text-[10px] text-text-muted truncate max-w-sm">{{ cmd.subtitle }}</div>
                </div>
              </div>

              <span class="text-[9px] font-mono uppercase px-1.5 py-0.5 rounded bg-bg-primary text-text-muted border border-border-primary shrink-0">
                {{ cmd.category }}
              </span>
            </button>
          }
        }
      </div>

      <!-- Footer Help -->
      <div class="p-3 border-t border-border-primary bg-bg-tertiary/20 flex items-center justify-between text-[10px] text-text-muted font-mono">
        <div class="flex items-center gap-3">
          <span><kbd class="bg-bg-primary px-1.5 py-0.5 rounded border border-border-primary">↑</kbd> <kbd class="bg-bg-primary px-1.5 py-0.5 rounded border border-border-primary">↓</kbd> Navigate</span>
          <span><kbd class="bg-bg-primary px-1.5 py-0.5 rounded border border-border-primary">↵</kbd> Select</span>
        </div>
        <span>SchoolLinx Command Hub</span>
      </div>
    </div>
  </div>
}
