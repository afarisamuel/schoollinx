  <script>
    (function() {
      try {
        // Theme initialization
        var saved = localStorage.getItem('theme');
        if (saved === 'light') {
          document.documentElement.classList.add('light-mode');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light-mode');
        }

        // Dynamically point manifest link to the tenant-specific manifest
        var hostname = window.location.hostname;
        var parts = hostname.split('.');
        var subdomain = '';
        if (parts.length >= 2) {
          var sub = parts[0];
          if (sub !== 'www' && sub !== 'localhost' && sub !== '127') {
            subdomain = sub;
          }
        }
        if (!subdomain) {
          subdomain = localStorage.getItem('tenant_subdomain') || '';
        }

        var manifestLink = document.getElementById('app-manifest') || document.querySelector('link[rel="manifest"]');
        if (manifestLink) {
          var manifestUrl = subdomain
            ? ('/manifest.webmanifest?subdomain=' + encodeURIComponent(subdomain))
            : '/manifest.webmanifest';
          manifestLink.setAttribute('href', manifestUrl);
        }

        // Register service worker as early as possible so Chrome can evaluate
        // the PWA installability criteria before the app fully bootstraps.
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
        }

      } catch (e) {}
    })();
  </script>
