<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SchoolLinx</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1e293b">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light') {
          document.documentElement.classList.add('light-mode');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light-mode');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script type="application/ld+json">

      "@context": "https://schema.org",

      "applicationCategory": "EducationalApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "524"
      }
    }
  </script>
  
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "How long does onboarding take?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Typically less than 48 hours. We handle data migration and initial tenant configuration for you."
        }
      }, {
        "@type": "Question",
        "name": "Can parents access the portal?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Every school gets a dedicated Parent Portal where parents can securely track their child's progress."
        }
      }, {
        "@type": "Question",
        "name": "What if we need a custom module?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We actively develop new features. Reach out to our team to discuss your specific requirements."
        }
      }]
    }
  </script>
</head>
