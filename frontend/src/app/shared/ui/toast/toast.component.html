<aside 
  class="fixed top-5 right-5 z-[99999] flex flex-col gap-3 max-w-sm w-full pointer-events-none p-2"
  role="region"
  aria-label="Notifications"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      role="status"
      aria-live="polite"
      class="app-toast-card pointer-events-auto relative overflow-hidden rounded-2xl shadow-xl transition-all duration-300 transform translate-y-0 opacity-100 flex items-start gap-3.5 p-4"
      [ngClass]="{
        'border-emerald-500/40': toast.type === 'success',
        'border-rose-500/40': toast.type === 'error',
        'border-amber-500/40': toast.type === 'warning',
        'border-indigo-500/40': toast.type === 'info'
      }"
    >
      <!-- Subtle Glow Accent -->
      <div class="absolute -top-10 -right-10 w-24 h-24 blur-[40px] rounded-full pointer-events-none opacity-20"
           [ngClass]="{
             'bg-emerald-500': toast.type === 'success',
             'bg-rose-500': toast.type === 'error',
             'bg-amber-500': toast.type === 'warning',
             'bg-indigo-500': toast.type === 'info'
           }"></div>

      <!-- Icon Indicator Badge -->
      <div class="shrink-0 mt-0.5">
        @if (toast.type === 'success') {
          <div class="w-8 h-8 rounded-xl bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 flex items-center justify-center border border-emerald-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
        } @else if (toast.type === 'error') {
          <div class="w-8 h-8 rounded-xl bg-rose-500/15 text-rose-600 dark:text-rose-400 flex items-center justify-center border border-rose-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
        } @else if (toast.type === 'warning') {
          <div class="w-8 h-8 rounded-xl bg-amber-500/15 text-amber-600 dark:text-amber-400 flex items-center justify-center border border-amber-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          </div>
        } @else {
          <div class="w-8 h-8 rounded-xl bg-indigo-500/15 text-indigo-600 dark:text-indigo-400 flex items-center justify-center border border-indigo-500/30">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </div>
        }
      </div>

      <!-- Content Body -->
      <div class="flex-1 min-w-0 pr-1">
        <h4 class="app-toast-title text-xs font-black tracking-wide flex items-center gap-1.5">
          <span>{{ toast.title }}</span>
        </h4>
        <p class="app-toast-msg text-xs mt-0.5 leading-relaxed break-words font-medium">{{ toast.message }}</p>
      </div>

      <!-- Dismiss Button -->
      <button
        type="button"
        (click)="toastService.remove(toast.id)"
        class="shrink-0 text-text-muted hover:text-text-primary p-1 rounded-lg hover:bg-bg-tertiary transition-colors cursor-pointer"
        title="Dismiss notification"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>

      <!-- Bottom Type Accent Line -->
      <div class="absolute bottom-0 left-0 right-0 h-[3px]" [ngClass]="{
        'bg-emerald-500': toast.type === 'success',
        'bg-rose-500': toast.type === 'error',
        'bg-amber-500': toast.type === 'warning',
        'bg-indigo-500': toast.type === 'info'
      }"></div>
    </div>
  }
</aside>
