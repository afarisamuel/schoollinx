@if (currentRequest(); as req) {
<div class="fixed inset-0 z-[999] flex items-center justify-center p-4 sm:p-6 select-none bg-bg-primary -sm transition-opacity">
    <div class="absolute inset-0" (click)="close(false)"></div>
    
    <div [@dialogAnimation] class="bg-bg-secondary w-full max-w-sm sm:max-w-md rounded-[32px] border border-border-secondary p-6 sm:p-8 shadow-2xl relative z-10 overflow-hidden flex flex-col gap-6">
        
        <!-- Dynamic Glow background -->
        <div class="absolute top-0 right-0 w-48 h-48 blur-[80px] rounded-full pointer-events-none opacity-20"
             [ngClass]="{
                 'bg-indigo-500': req.type === 'info',
                 'bg-emerald-500': req.type === 'success',
                 'bg-red-500': req.type === 'error' || req.type === 'danger',
                 'bg-amber-500': req.type === 'warning'
             }"></div>

        <!-- Header -->
        <div class="flex items-start gap-4">
            <!-- Icon -->
            <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 border border-border-primary"
                 [ngClass]="{
                     'bg-indigo-500/10 text-indigo-400': req.type === 'info',
                     'bg-emerald-500/10 text-emerald-400': req.type === 'success',
                     'bg-red-500/10 text-red-500': req.type === 'error' || req.type === 'danger',
                     'bg-amber-500/10 text-amber-400': req.type === 'warning'
                 }">
                <!-- Info Icon -->
                @if (req.type === 'info') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                }
                <!-- Success Icon -->
                @if (req.type === 'success') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                }
                <!-- Warning Icon -->
                @if (req.type === 'warning') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
                }
                <!-- Danger/Error Icon -->
                @if (req.type === 'danger' || req.type === 'error') {
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                }
            </div>

            <div class="flex flex-col gap-1.5 pt-1">
                <h3 class="text-xl font-black text-text-primary tracking-tight">{{ req.title }}</h3>
                <p class="text-sm font-medium leading-relaxed text-text-secondary" [innerHTML]="req.message"></p>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 pt-2 w-full">
            @if (req.isConfirm) {
            <button class="flex-1 px-5 py-3.5 bg-bg-tertiary hover:bg-bg-secondary text-text-primary font-black text-xs uppercase tracking-widest rounded-2xl transition-all" (click)="close(false)">
                Cancel
            </button>
            <button class="flex-1 px-5 py-3.5 text-text-primary font-black text-xs uppercase tracking-widest rounded-2xl transition-all shadow-xl active:scale-95 text-center" 
                    [ngClass]="{
                        'bg-red-600 hover:bg-red-500 shadow-red-500/20': req.type === 'danger' || req.type === 'error',
                        'bg-amber-600 hover:bg-amber-500 shadow-amber-500/20': req.type === 'warning',
                        'bg-indigo-600 hover:bg-indigo-500 shadow-indigo-500/20': req.type === 'info',
                        'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-500/20': req.type === 'success'
                    }"
                    (click)="close(true)">
                {{ req.actionText }}
            </button>
            } @else {
            <button class="w-full px-5 py-3.5 bg-bg-tertiary hover:bg-bg-secondary text-text-primary font-black text-xs uppercase tracking-widest rounded-2xl transition-all shadow-lg border border-border-primary" (click)="close(true)">
                {{ req.actionText }}
            </button>
            }
        </div>
    </div>
</div>
}
