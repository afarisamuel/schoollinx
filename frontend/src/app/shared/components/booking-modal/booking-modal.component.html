<!-- Backdrop -->
<div class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-fade-in" (click)="close.emit()">

    <!-- Modal Panel -->
    <div class="w-full max-w-lg bg-bg-secondary border border-border-primary rounded-3xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col animate-slide-up" (click)="$event.stopPropagation()">
        
        <!-- Header -->
        <div class="relative px-6 pt-6 pb-5 border-b border-border-primary">
            <!-- Accent Top Bar -->
            <div class="absolute top-0 left-0 right-0 h-1.5"
                 [class.bg-blue-500]="resource?.type === 'BOOK' || resource?.type === 'ROOM'"
                 [class.bg-emerald-500]="resource?.type === 'LAB'"
                 [class.bg-amber-500]="resource?.type === 'EQUIPMENT'"
                 [class.bg-purple-500]="resource?.type === 'VEHICLE'"
                 [class.bg-rose-500]="resource?.type === 'SPORTS'"></div>

            <div class="flex items-start justify-between gap-4">
                <div class="flex items-center gap-3.5">
                    <!-- Resource Icon -->
                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center border shadow-sm"
                         [class.bg-blue-500/10]="resource?.type === 'BOOK' || resource?.type === 'ROOM'"
                         [class.border-blue-500/20]="resource?.type === 'BOOK' || resource?.type === 'ROOM'"
                         [class.bg-emerald-500/10]="resource?.type === 'LAB'"
                         [class.border-emerald-500/20]="resource?.type === 'LAB'"
                         [class.bg-amber-500/10]="resource?.type === 'EQUIPMENT'"
                         [class.border-amber-500/20]="resource?.type === 'EQUIPMENT'"
                         [class.bg-purple-500/10]="resource?.type === 'VEHICLE'"
                         [class.border-purple-500/20]="resource?.type === 'VEHICLE'"
                         [class.bg-rose-500/10]="resource?.type === 'SPORTS'"
                         [class.border-rose-500/20]="resource?.type === 'SPORTS'">
                        <i class="fas fa-calendar-check text-lg"
                           [class.text-blue-400]="resource?.type === 'BOOK' || resource?.type === 'ROOM'"
                           [class.text-emerald-400]="resource?.type === 'LAB'"
                           [class.text-amber-400]="resource?.type === 'EQUIPMENT'"
                           [class.text-purple-400]="resource?.type === 'VEHICLE'"
                           [class.text-rose-400]="resource?.type === 'SPORTS'"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] font-black uppercase tracking-widest text-text-muted">Reserve Asset</span>
                        <h2 class="text-base sm:text-lg font-black text-text-primary leading-tight line-clamp-1">{{ resource?.name }}</h2>
                        <span class="text-[11px] font-bold text-text-secondary mt-0.5 flex items-center gap-1.5">
                            <i class="fas fa-map-marker-alt text-rose-400 text-[10px]"></i>
                            {{ resource?.location || 'Campus Facilities' }}
                        </span>
                    </div>
                </div>

                <!-- Close Button -->
                <button (click)="close.emit()" class="w-8 h-8 rounded-xl bg-bg-tertiary hover:bg-bg-primary border border-border-primary flex items-center justify-center text-text-muted hover:text-text-primary transition-all">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Modal Body -->
        <div class="flex flex-col gap-4 p-6 overflow-y-auto custom-scrollbar">
            
            <!-- Quick Preset Slots -->
            <div class="flex flex-col gap-1.5">
                <label class="text-[11px] font-bold text-text-muted uppercase tracking-wider">Quick Preset Slots</label>
                <div class="grid grid-cols-2 gap-2">
                    @for (slot of presetSlots; track slot.label) {
                        <button type="button" (click)="applyPreset(slot)"
                                class="px-2.5 py-1.5 rounded-xl border text-[11px] font-bold text-left transition-all"
                                [class.bg-blue-600]="startTime() === slot.start && endTime() === slot.end"
                                [class.text-white]="startTime() === slot.start && endTime() === slot.end"
                                [class.border-blue-500]="startTime() === slot.start && endTime() === slot.end"
                                [class.bg-bg-tertiary]="startTime() !== slot.start || endTime() !== slot.end"
                                [class.text-text-secondary]="startTime() !== slot.start || endTime() !== slot.end"
                                [class.border-border-primary]="startTime() !== slot.start || endTime() !== slot.end">
                            <div>{{ slot.label }}</div>
                            <div class="text-[9.5px] opacity-80 font-mono">{{ slot.start }} - {{ slot.end }}</div>
                        </button>
                    }
                </div>
            </div>

            <!-- Date & Time Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-1">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-text-secondary">Booking Date</label>
                    <input type="date" [ngModel]="bookingDate()" (ngModelChange)="bookingDate.set($event)"
                           class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-3 py-2 text-xs text-text-primary focus:outline-none focus:border-blue-500 transition-all"
                           style="color-scheme: dark;">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-text-secondary">Start Time</label>
                    <input type="time" [ngModel]="startTime()" (ngModelChange)="startTime.set($event)"
                           class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-3 py-2 text-xs text-text-primary focus:outline-none focus:border-blue-500 transition-all"
                           style="color-scheme: dark;">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-text-secondary">End Time</label>
                    <input type="time" [ngModel]="endTime()" (ngModelChange)="endTime.set($event)"
                           class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-3 py-2 text-xs text-text-primary focus:outline-none focus:border-blue-500 transition-all"
                           style="color-scheme: dark;">
                </div>
            </div>

            <!-- Purpose & Expected Headcount -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2 flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-text-secondary">Purpose of Booking</label>
                    <input type="text" [ngModel]="purpose()" (ngModelChange)="purpose.set($event)" placeholder="e.g., Grade 11 Chemistry Practical, Robotics Club"
                           class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-3.5 py-2 text-xs text-text-primary placeholder:text-text-muted focus:outline-none focus:border-blue-500 transition-all">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-text-secondary">Expected Headcount</label>
                    <input type="number" [ngModel]="headcount()" (ngModelChange)="headcount.set($event)" min="1" [max]="resource?.capacity || 100"
                           class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-3.5 py-2 text-xs text-text-primary focus:outline-none focus:border-blue-500 transition-all">
                </div>
            </div>

            <!-- Special Requests / Notes -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-bold text-text-secondary">Special Notes / Requirements</label>
                <textarea [ngModel]="notes()" (ngModelChange)="notes.set($event)" rows="2" placeholder="e.g., Please ensure optical microscopes and reagent sets are prepped..."
                          class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-3.5 py-2 text-xs text-text-primary placeholder:text-text-muted focus:outline-none focus:border-blue-500 transition-all resize-none"></textarea>
            </div>

            <!-- Error Notification -->
            @if (error()) {
                <div class="p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl flex items-center gap-2.5 text-xs text-rose-400 font-bold">
                    <i class="fas fa-exclamation-triangle flex-shrink-0"></i>
                    <span>{{ error() }}</span>
                </div>
            }
        </div>

        <!-- Footer Actions -->
        <div class="flex items-center gap-3 p-5 border-t border-border-primary bg-bg-secondary">
            <button type="button" (click)="close.emit()"
                    class="flex-1 py-2.5 px-4 rounded-xl border border-border-secondary bg-bg-tertiary hover:bg-bg-primary text-text-secondary text-xs font-bold transition-all">
                Cancel
            </button>
            <button type="button" (click)="submit()"
                    [disabled]="isSubmitting() || !bookingDate() || !startTime() || !endTime()"
                    class="flex-1 py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white text-xs font-black uppercase tracking-wider transition-all shadow-md shadow-blue-600/20 flex items-center justify-center gap-2">
                @if (isSubmitting()) {
                    <i class="fas fa-spinner fa-spin text-xs"></i>
                    <span>Reserving...</span>
                } @else {
                    <i class="fas fa-calendar-check text-xs"></i>
                    <span>Confirm Reservation</span>
                }
            </button>
        </div>

    </div>
</div>
