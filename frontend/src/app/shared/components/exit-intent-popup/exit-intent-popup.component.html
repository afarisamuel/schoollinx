<div class="popup-overlay" *ngIf="showPopup" (click)="closePopup()">
  <div class="popup-modal" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closePopup()"><i class="fas fa-times"></i></button>
    <div class="popup-header bg-pink-50">
      <div class="p-icon text-teal-600"><i class="fas fa-book-open"></i></div>
      <h3 class="p-title">Before you go...</h3>
    </div>
    <div class="popup-body">
      <p class="p-desc">Get our free <strong>School Digitization Guide</strong>. Learn how top institutions save 20+ hours a week.</p>
      <form class="p-form">
        <input type="email" placeholder="Enter your email" />
        <button type="button" class="btn-primary w-full" (click)="closePopup()">Send me the guide <i class="fas fa-arrow-right"></i></button>
      </form>
    </div>
  </div>
</div>
