<div class="min-h-screen flex items-center justify-center bg-bg-primary p-4 animate-fade-in">
    <div class="w-full max-w-md p-10 bg-bg-secondary border border-border-primary shadow-2xl rounded-2xl flex flex-col gap-6">
        <div class="text-xl md:text-2xl font-bold text-center bg-teal-600 text-teal-400">
            Account Setup
        </div>
        <p class="text-center text-text-secondary text-sm">
            Please set a secure password for your new administrator account.
        </p>

        <form [formGroup]="setupForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
            <div class="flex flex-col gap-2">
                <label for="newPassword" class="text-sm font-medium text-text-secondary">New Password</label>
                <input id="newPassword" type="password" formControlName="newPassword" 
                    class="px-4 py-3 bg-bg-tertiary border border-border-secondary rounded-xl text-text-primary placeholder:text-text-muted focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all"
                    placeholder="••••••••" />
                <div *ngIf="setupForm.get('newPassword')?.touched && setupForm.get('newPassword')?.errors?.['minlength']" class="text-xs text-red-500">
                    Password must be at least 8 characters long.
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="confirmPassword" class="text-sm font-medium text-text-secondary">Confirm Password</label>
                <input id="confirmPassword" type="password" formControlName="confirmPassword" 
                    class="px-4 py-3 bg-bg-tertiary border border-border-secondary rounded-xl text-text-primary placeholder:text-text-muted focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all"
                    placeholder="••••••••" />
                <div *ngIf="setupForm.get('confirmPassword')?.touched && setupForm.hasError('mismatch')" class="text-xs text-red-500">
                    Passwords do not match.
                </div>
            </div>

            <div class="px-4 py-3 bg-red-500/10 border border-red-500/20 text-red-500 text-sm rounded-lg text-center" *ngIf="error">
                {{ error }}
            </div>

            <div class="px-4 py-3 bg-green-500/10 border border-green-500/20 text-green-500 text-sm rounded-lg text-center" *ngIf="success">
                {{ success }}
            </div>

            <button type="submit" 
                class="w-full mt-4 py-3.5 bg-teal-600 hover:bg-teal-500 text-text-primary font-bold rounded-xl shadow-xl shadow-teal-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="setupForm.invalid || loading || !token">
                {{ loading ? 'Updating Password…' : 'Activate Account' }}
            </button>
        </form>
    </div>
</div>
