<div class="min-h-screen flex items-center justify-center login-container p-4">
    <div class="w-full max-w-md p-10 glass-card rounded-3xl flex flex-col gap-8 stagger-entry">
        
        <div class="flex flex-col gap-2 items-center text-center stagger-entry stagger-1">
            <div class="w-16 h-16 bg-teal-600 rounded-2xl flex items-center justify-center shadow-lg shadow-teal-500/20 mb-2">
                <i class="fas fa-lock text-xl md:text-2xl text-text-primary"></i>
            </div>
            <h1 class="text-xl md:text-2xl font-black tracking-tight text-text-primary logo-glow">
                Security Update
            </h1>
            <p class="text-text-secondary font-medium">Please update your password to continue</p>
        </div>
        
        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
            <div class="flex flex-col gap-2 stagger-entry stagger-2">
                <label for="old_password" class="text-xs font-bold uppercase tracking-widest text-text-muted ml-1">Current Password</label>
                <div class="relative">
                    <input id="old_password" type="password" formControlName="old_password" 
                        class="w-full px-5 py-4 input-field rounded-2xl text-text-primary placeholder:text-text-muted focus:outline-none"
                        placeholder="••••••••" />
                </div>
            </div>

            <div class="flex flex-col gap-2 stagger-entry stagger-3">
                <label for="new_password" class="text-xs font-bold uppercase tracking-widest text-text-muted ml-1">New Password</label>
                <div class="relative">
                    <input id="new_password" type="password" formControlName="new_password" 
                        class="w-full px-5 py-4 input-field rounded-2xl text-text-primary placeholder:text-text-muted focus:outline-none"
                        placeholder="Min 8 chars, 1 uppercase, 1 number, 1 special" />
                </div>
            </div>

            <div class="flex flex-col gap-2 stagger-entry stagger-4">
                <label for="confirm_password" class="text-xs font-bold uppercase tracking-widest text-text-muted ml-1">Confirm New Password</label>
                <div class="relative">
                    <input id="confirm_password" type="password" formControlName="confirm_password" 
                        class="w-full px-5 py-4 input-field rounded-2xl text-text-primary placeholder:text-text-muted focus:outline-none"
                        placeholder="••••••••" />
                </div>
                <div class="px-4 py-2 mt-1 text-red-400 text-xs rounded-xl" *ngIf="changePasswordForm.hasError('mismatch') && (changePasswordForm.get('confirm_password')?.dirty || changePasswordForm.get('confirm_password')?.touched)">
                    Passwords do not match.
                </div>
            </div>

            <div class="px-4 py-3 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-xl text-center stagger-entry" *ngIf="error">
                <i class="fas fa-exclamation-circle mr-2"></i> {{ error }}
            </div>

            <div class="stagger-entry stagger-5">
                <button type="submit" 
                    class="w-full mt-2 py-4 bg-teal-600 hover:bg-teal-500 text-text-primary font-black rounded-2xl shadow-2xl shadow-teal-500/30 transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed group"
                    [disabled]="changePasswordForm.invalid || loading">
                    <span *ngIf="!loading" class="flex items-center justify-center gap-2">
                        Update Password <i class="fas fa-check text-xs transition-transform group-hover:scale-110"></i>
                    </span>
                    <span *ngIf="loading" class="flex items-center justify-center gap-2">
                        <i class="fas fa-spinner fa-spin"></i> Updating…
                    </span>
                </button>
            </div>
        </form>
    </div>
</div>
