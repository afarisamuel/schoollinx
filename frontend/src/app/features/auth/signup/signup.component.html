<div class="min-h-screen flex items-center justify-center bg-bg-primary py-12 px-4 sm:px-6 lg:px-8 animate-fade-in">
    <div class="w-full max-w-lg p-10 bg-bg-secondary border border-border-primary shadow-2xl rounded-2xl flex flex-col gap-6">
        <div class="flex flex-col gap-1 text-center">
            <h1 class="text-xl md:text-2xl font-bold text-blue-400">
                Create Your Account
            </h1>
            <p class="text-sm text-text-secondary">Join the High School Management System</p>
        </div>

        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <div class="flex flex-col gap-2">
                    <label for="email" class="text-sm font-medium text-text-secondary">Email Address</label>
                    <input id="email" type="email" formControlName="email" 
                        class="px-4 py-2.5 bg-bg-tertiary border border-border-secondary rounded-xl text-text-primary placeholder:text-text-muted focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
                        placeholder="name@example.com" />
                </div>

                <div class="flex flex-col gap-2">
                    <label for="username" class="text-sm font-medium text-text-secondary">Username</label>
                    <input id="username" type="text" formControlName="username" 
                        class="px-4 py-2.5 bg-bg-tertiary border border-border-secondary rounded-xl text-text-primary placeholder:text-text-muted focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
                        placeholder="johndoe" />
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <label for="phoneNumber" class="text-sm font-medium text-text-secondary">Phone Number (Optional)</label>
                <input id="phoneNumber" type="text" formControlName="phoneNumber" 
                    class="px-4 py-2.5 bg-bg-tertiary border border-border-secondary rounded-xl text-text-primary placeholder:text-text-muted focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
                    placeholder="+1 (555) 000-0000" />
            </div>

            <div class="flex flex-col gap-2">
                <label for="password" class="text-sm font-medium text-text-secondary">Password</label>
                <input id="password" type="password" formControlName="password" 
                    class="px-4 py-2.5 bg-bg-tertiary border border-border-secondary rounded-xl text-text-primary placeholder:text-text-muted focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm"
                    placeholder="••••••••" />
            </div>

            <div class="flex flex-col gap-2">
                <label for="role" class="text-sm font-medium text-text-secondary">Select Your Role</label>
                <select id="role" formControlName="role" 
                    class="px-4 py-2.5 bg-bg-tertiary border border-border-secondary rounded-xl text-text-primary focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all text-sm">
                    <option *ngFor="let r of roles" [value]="r" class="bg-bg-secondary">{{ r }}</option>
                </select>
            </div>

            <div class="px-4 py-3 bg-red-500/10 border border-red-500/20 text-red-500 text-sm rounded-lg text-center" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <button type="submit" 
                class="w-full mt-2 py-3.5 bg-blue-600 hover:bg-blue-500 text-text-primary font-bold rounded-xl shadow-xl shadow-blue-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                [disabled]="signupForm.invalid || isLoading">
                {{ isLoading ? 'Creating account...' : 'Create Account' }}
            </button>

            <div class="text-center text-sm text-text-secondary mt-2">
                Already have an account? <a routerLink="/login" class="text-blue-400 font-semibold hover:underline">Sign In</a>
            </div>
        </form>
    </div>
</div>
