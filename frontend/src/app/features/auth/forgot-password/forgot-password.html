<div class="min-h-screen bg-bg-primary font-sans text-text-primary flex relative overflow-hidden justify-center items-center">
  <div class="absolute inset-0 z-0 bg-bg-primary">
    <div class="absolute -top-[20%] -left-[20%] w-[70%] h-[70%] rounded-full bg-indigo-600/30 blur-[120px] mix-blend-screen animate-pulse" style="animation-duration: 8s;"></div>
    <div class="absolute bottom-[10%] -right-[10%] w-[60%] h-[60%] rounded-full bg-purple-600/20 blur-[100px] mix-blend-screen animate-pulse" style="animation-duration: 10s; animation-delay: 2s;"></div>
    <div class="absolute top-[40%] left-[30%] w-[50%] h-[50%] rounded-full bg-blue-500/10 blur-[80px] mix-blend-screen"></div>
  </div>

  <div class="w-full max-w-md p-6 sm:p-12 relative z-10 animate-in slide-in-from-bottom-8 duration-700 fade-in">
    <div class="mb-10 text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 shadow-lg shadow-indigo-500/20 mb-6">
        <img src="assets/images/app-icon.png" class="w-full h-full object-contain p-1" alt="School Linx Logo">
      </div>
      <h2 class="text-3xl font-black text-text-primary mb-3 tracking-tight">Forgot Password</h2>
      <p class="text-text-muted font-medium">Enter your email address and we will send you a secure link to reset your password.</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="message" class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-5 py-4 rounded-2xl text-sm font-bold mb-8 flex items-start gap-3 animate-fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="mt-0.5 shrink-0"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      {{ message }}
    </div>

    <!-- General Error -->
    <div *ngIf="error" class="bg-rose-500/10 border border-rose-500/20 text-rose-400 px-5 py-4 rounded-2xl text-sm font-bold mb-8 flex items-start gap-3 animate-fade-in">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="mt-0.5 shrink-0"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="space-y-6" *ngIf="!message">
      
      <!-- Email -->
      <div class="group">
        <label class="block text-[11px] font-black uppercase tracking-[0.2em] text-text-muted group-focus-within:text-indigo-400 transition-colors mb-3">Email Address</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-text-muted group-focus-within:text-indigo-400 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <input type="email" formControlName="email" required
                 class="w-full bg-text-primary/5 border border-border-secondary rounded-2xl pl-12 pr-4 py-4 text-text-primary font-medium placeholder-text-muted/60 focus:outline-none focus:border-indigo-500/50 focus:bg-indigo-500/10 focus:ring-4 focus:ring-indigo-500/10 transition-all"
                 placeholder="name@example.com">
        </div>
      </div>

      <button type="submit" [disabled]="forgotPasswordForm.invalid || isLoading"
              class="w-full mt-8 bg-text-primary text-bg-primary font-black py-4 rounded-2xl text-sm uppercase tracking-widest shadow-lg shadow-text-primary/10 hover:shadow-xl hover:shadow-text-primary/20 hover:scale-[1.02] transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:scale-100 flex items-center justify-center gap-3">
        <span *ngIf="!isLoading" class="flex items-center justify-center gap-3">
          Send Reset Link
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </span>
        <span *ngIf="isLoading" class="flex items-center justify-center gap-3">
          <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          Sending...
        </span>
      </button>
    </form>

    <div class="text-center mt-8">
      <a routerLink="/login" class="text-xs font-bold text-text-muted hover:text-text-primary transition-colors">
        &larr; Back to Login
      </a>
    </div>
  </div>
</div>
