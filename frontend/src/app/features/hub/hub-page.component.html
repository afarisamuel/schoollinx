<div class="relative min-h-[calc(100vh-96px)] bg-bg-primary text-text-primary font-sans overflow-y-auto overflow-x-hidden">
  
  <!-- Premium Background Effects -->
  <div class="absolute inset-x-0 top-0 h-[800px] overflow-hidden pointer-events-none z-0">
      <div class="absolute -top-[10%] left-[10%] w-[800px] h-[800px] bg-blue-500/10 blur-[140px] rounded-full"></div>
      <div class="absolute top-[20%] right-[5%] w-[600px] h-[600px] bg-blue-500/10 blur-[120px] rounded-full"></div>
      <div class="absolute inset-0 bg-bg-primary pointer-events-none"></div>
  </div>

  @if (config(); as cfg) {
  <!-- ===== BACK + HEADER ===== -->
  <header class="pt-8 pb-6 px-4 md:px-8 relative z-10">
    <!-- Back Button -->
    <button
      (click)="goBack()"
      class="flex items-center gap-2 text-text-primary/40 hover:text-text-primary/80 transition-colors mb-6 group w-fit"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 group-hover:-translate-x-1 transition-transform"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span class="text-[10px] font-bold tracking-widest uppercase">Back to Dashboard</span>
    </button>

    <!-- Hub Title -->
    <div class="flex items-end justify-between">
      <div class="animate-bento-in">
        <div class="w-12 h-1.5 mb-4 rounded-full shadow-[0_0_15px_rgba(255,255,255,0.2)]" [style.background]="cfg.accent"></div>
        <h1 class="text-3xl md:text-5xl font-black tracking-tight text-text-primary">
          {{ cfg.title }}
        </h1>
        <p class="text-text-secondary font-bold tracking-[0.2em] text-xs mt-3 uppercase">
          {{ cfg.subtitle }}
        </p>
      </div>
      <div class="flex items-center gap-2 animate-bento-in delay-1 bg-bg-secondary border border-border-primary px-4 py-2 rounded-full backdrop-blur-md">
        <span class="text-xl md:text-2xl font-black text-text-primary">{{ visibleTiles().length }}</span>
        <span class="text-[9px] font-bold text-text-muted uppercase tracking-widest">
          Items
        </span>
      </div>
    </div>
  </header>

  <!-- ===== BENTO TILE GRID ===== -->
  <div class="pb-10 px-4 md:px-8 relative z-10">
    <div class="bento-grid">
      @for (tile of visibleTiles(); track tile.route; let i = $index) {
      <a
        [routerLink]="tile.route"
        [class]="getTileClass(tile)"
        [style.animation-delay.ms]="50 + (i * 60)"
        [style.--glow-color]="tile.color + '33'"
        [style.--glow-color-dim]="tile.color + '1A'"
        [style.--icon-color]="tile.color"
      >
        <div class="bento-content">
          <div class="flex justify-between items-start mb-4">
            <div class="bento-icon">
              <svg
                class="w-8 h-8"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path [attr.d]="tile.icon" />
              </svg>
            </div>
          </div>
          <div class="mt-auto">
            <h3 class="text-lg font-bold text-text-primary mb-1">{{ tile.label }}</h3>
            @if (tile.subtitle) {
              <p class="text-xs text-text-primary/60 font-medium">
                {{ tile.subtitle }}
              </p>
            }
          </div>
        </div>
      </a>
      }
    </div>
  </div>
  }
</div>
