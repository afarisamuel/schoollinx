<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/70 backdrop-blur-sm animate-fade-in" (click)="onClose()">
  <div class="relative w-full max-w-md bg-bg-secondary border border-border-primary rounded-t-3xl sm:rounded-3xl p-5 sm:p-8 shadow-2xl overflow-y-auto max-h-[92vh] sm:max-h-[85vh] animate-slide-up sm:animate-fade-in" (click)="$event.stopPropagation()">
    <!-- Mobile Bottomsheet Handle -->
    <div class="pt-1 pb-1 sm:hidden">
      <div class="bottomsheet-handle"></div>
    </div>

    <button
      class="absolute top-5 right-5 sm:top-6 sm:right-6 p-2 rounded-xl bg-bg-tertiary text-text-muted hover:text-text-primary border border-border-primary transition-colors"
      (click)="onClose()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </svg>
    </button>
    <h3 class="text-lg sm:text-xl font-black text-text-primary mb-1">Top-Up Wallet</h3>
    <p class="text-xs sm:text-sm text-text-muted mb-5 sm:mb-6">Add prepaid balance to a student's wallet.</p>

    <div class="space-y-4 sm:space-y-5">
      <div class="relative z-30">
        <label class="block text-[10px] font-black text-text-muted uppercase tracking-widest mb-1.5"
          >Student ID</label
        >
        <app-student-search-dropdown 
          [(studentId)]="topUpData.student_id"
          [required]="true"
        ></app-student-search-dropdown>
      </div>
      <div>
        <label class="block text-[10px] font-black text-text-muted uppercase tracking-widest mb-1.5"
          >Amount (GHS)</label
        >
        <input
          type="number"
          [(ngModel)]="topUpData.amount"
          placeholder="0.00"
          class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-4 py-2.5 sm:py-3 text-text-primary text-xs sm:text-sm focus:outline-none focus:border-blue-500 transition-colors font-mono font-bold"
        />
      </div>
      <div>
        <label class="block text-[10px] font-black text-text-muted uppercase tracking-widest mb-1.5"
          >Description</label
        >
        <input
          type="text"
          [(ngModel)]="topUpData.description"
          placeholder="E.g. Term 2 Prepaid Top-up"
          class="w-full bg-bg-tertiary border border-border-primary rounded-xl px-4 py-2.5 sm:py-3 text-text-primary text-xs sm:text-sm focus:outline-none focus:border-blue-500 transition-colors"
        />
      </div>
    </div>

    <div class="mt-6 sm:mt-8 flex gap-3">
      <button
        class="flex-1 px-4 sm:px-5 py-2.5 sm:py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-bg-tertiary border border-border-primary text-text-primary hover:bg-bg-primary transition-all"
        (click)="onClose()"
        [disabled]="toppingUp"
      >
        Cancel
      </button>
      <button
        class="flex-1 px-4 sm:px-5 py-2.5 sm:py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-blue-600 text-white hover:bg-blue-500 transition-all disabled:opacity-50 shadow-md shadow-blue-500/20"
        (click)="onSubmit()"
        [disabled]="toppingUp"
      >
        {{ toppingUp ? 'Processing...' : 'Top-Up' }}
      </button>
    </div>
  </div>
</div>
