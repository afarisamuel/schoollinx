<div class="flex flex-col gap-8 animate-fade-in max-w-4xl mx-auto">

    <!-- Page Header -->
    <div class="flex items-center gap-4">
        <a routerLink="/hr/leave" class="p-2.5 hover:bg-bg-tertiary text-text-muted hover:text-text-primary rounded-xl transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </a>
        <div class="h-10 w-px bg-bg-tertiary"></div>
        <div>
            <h1 class="text-xl md:text-2xl font-black tracking-tight text-text-primary">Request Time Off</h1>
            <p class="text-sm font-medium text-text-secondary mt-1">Submit a formal request for leave or time off</p>
        </div>
    </div>

    <form (submit)="submitLeave($event)" class="flex flex-col gap-6" novalidate>

        <!-- SECTION: Leave Details -->
        <div class="bg-bg-secondary border border-border-primary rounded-3xl p-8 flex flex-col gap-6 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-amber-500/5 blur-[100px] rounded-full pointer-events-none"></div>
            <div class="flex items-center gap-3 pb-4 border-b border-border-primary">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                </div>
                <div>
                    <h2 class="text-sm font-black text-text-primary">Leave Details</h2>
                    <p class="text-[10px] text-text-muted uppercase tracking-widest font-bold">Specify the type and duration</p>
                </div>
            </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Employee -->
                    <div class="flex flex-col gap-2 md:col-span-2">
                        <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Employee *</label>
                        <div class="input-wrapper group">
                            <select 
                                [ngModel]="form().staff_id" 
                                (ngModelChange)="updateForm('staff_id', $event)" 
                                name="staff_id" 
                                required
                                class="field-input">
                                <option value="" disabled selected>Select an employee</option>
                                @for (staff of staffProfiles(); track staff.id) {
                                    <option [value]="staff.id">{{ staff.first_name }} {{ staff.last_name }} ({{ staff.job_title }})</option>
                                }
                            </select>
                        </div>
                    </div>

                    <!-- Leave Type -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="field-label">Leave Type <span class="text-amber-400">*</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        <select class="field-input border-border-secondary pl-12"
                                [value]="form().leave_type"
                                (change)="updateForm('leave_type', $any($event.target).value)">
                            @for (type of leaveTypes; track type) {
                                <option [value]="type">{{ type }}</option>
                            }
                        </select>
                    </div>
                </div>

                <!-- Start Date -->
                <div class="flex flex-col gap-2">
                    <label class="field-label">Start Date <span class="text-amber-400">*</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        <input type="date" 
                            [value]="form().start_date || ''"
                            (input)="updateForm('start_date', $any($event.target).value)"
                            class="field-input [color-scheme:dark] border-border-secondary pl-12" required>
                    </div>
                </div>

                <!-- End Date -->
                <div class="flex flex-col gap-2">
                    <label class="field-label">End Date <span class="text-amber-400">*</span></label>
                    <div class="input-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        <input type="date" 
                            [value]="form().end_date || ''"
                            (input)="updateForm('end_date', $any($event.target).value)"
                            class="field-input [color-scheme:dark] border-border-secondary pl-12" required>
                    </div>
                </div>

                <!-- Reason -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="field-label">Reason (Optional)</label>
                    <div class="input-wrapper">
                        <svg class="input-icon top-3.5" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <textarea rows="4" placeholder="Provide additional context for this request..."
                            [value]="form().reason || ''"
                            (input)="updateForm('reason', $any($event.target).value)"
                            class="field-input resize-none border-border-secondary pl-12"></textarea>
                    </div>
                </div>

            </div>
        </div>

        <!-- Sticky Action Bar -->
        <div class="sticky bottom-0 z-10 flex items-center justify-between p-4 bg-bg-primary/80 border border-border-primary rounded-2xl shadow-xl mt-4">
            <div class="flex items-center gap-2 text-xs font-semibold text-text-muted">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                <span>Fields marked <span class="text-amber-400 font-black">*</span> are required.</span>
            </div>
            <div class="flex items-center gap-3">
                <a routerLink="/hr/leave" class="px-6 py-2.5 bg-bg-tertiary hover:bg-bg-secondary border border-border-secondary text-text-secondary hover:text-text-primary text-sm font-bold rounded-xl transition-all">
                    Cancel
                </a>
                <button type="submit" [disabled]="isSaving()"
                    class="px-8 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-text-primary text-sm font-bold rounded-xl shadow-lg shadow-indigo-500/20 transition-all flex items-center gap-2">
                    @if (isSaving()) {
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
                        Submitting...
                    } @else {
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Submit Request
                    }
                </button>
            </div>
        </div>
    </form>
</div>
