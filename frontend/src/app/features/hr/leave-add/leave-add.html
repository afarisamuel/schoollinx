<div class="flex flex-col gap-6 sm:gap-8 animate-fade-in max-w-4xl mx-auto pb-12">

    <!-- Page Header -->
    <div class="flex items-center gap-4">
        <a routerLink="/hr/leave" class="p-2.5 hover:bg-bg-tertiary text-text-muted hover:text-text-primary rounded-2xl border border-white/10 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div class="h-10 w-px bg-white/10"></div>
        <div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-text-primary">Submit Time-Off Application</h1>
            <p class="text-xs sm:text-sm text-text-muted mt-0.5">Submit an authorized absence or vacation leave on behalf of faculty or staff</p>
        </div>
    </div>

    <form (submit)="submitLeave($event)" class="flex flex-col gap-6" novalidate>

        <!-- Leave Details Section -->
        <div class="bg-gradient-to-b from-bg-secondary to-bg-secondary/90 border border-white/10 rounded-3xl p-6 sm:p-8 flex flex-col gap-6 shadow-2xl relative overflow-hidden">
            <div class="pointer-events-none absolute top-0 right-0 w-64 h-64 bg-amber-500/5 blur-[100px] rounded-full"></div>
            
            <div class="flex items-center gap-3 pb-4 border-b border-white/10">
                <div class="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                </div>
                <div>
                    <h2 class="text-sm sm:text-base font-black text-text-primary">Leave Scope & Duration</h2>
                    <p class="text-[10px] text-text-muted uppercase tracking-widest font-bold">Specify the staff member, category, and dates</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                
                <!-- Employee Selection -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Employee <span class="text-amber-400">*</span></label>
                    <div class="relative">
                        <select 
                            [ngModel]="form().staff_id" 
                            (ngModelChange)="updateForm('staff_id', $event)" 
                            name="staff_id" 
                            required
                            class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 appearance-none pr-10 shadow-sm cursor-pointer">
                            <option value="" disabled selected>— Select staff member —</option>
                            @for (staff of staffProfiles(); track staff.id) {
                                <option [value]="staff.id">{{ staff.first_name }} {{ staff.last_name }} ({{ staff.job_title || 'Faculty' }} - {{ staff.department || 'General' }})</option>
                            }
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-text-muted">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Leave Type -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Leave Category <span class="text-amber-400">*</span></label>
                    <div class="relative">
                        <select class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 appearance-none pr-10 shadow-sm cursor-pointer"
                                [value]="form().leave_type"
                                (change)="updateForm('leave_type', $any($event.target).value)">
                            @for (type of leaveTypes; track type) {
                                <option [value]="type">{{ type }}</option>
                            }
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-text-muted">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Start Date -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Start Date <span class="text-amber-400">*</span></label>
                    <input type="date" 
                        [value]="form().start_date || ''"
                        (input)="updateForm('start_date', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 [color-scheme:dark] shadow-sm" required>
                </div>

                <!-- End Date -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">End Date <span class="text-amber-400">*</span></label>
                    <input type="date" 
                        [value]="form().end_date || ''"
                        (input)="updateForm('end_date', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 [color-scheme:dark] shadow-sm" required>
                </div>

                <!-- Reason / Context -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Reason & Administrative Notes</label>
                    <textarea rows="4" placeholder="Provide background, emergency contact notes, or coverage handover details..."
                        [value]="form().reason || ''"
                        (input)="updateForm('reason', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 resize-none shadow-sm"></textarea>
                </div>

            </div>
        </div>

        <!-- Sticky Action Footer -->
        <div class="sticky bottom-4 z-20 flex items-center justify-between p-4 sm:p-5 bg-bg-secondary/90 border border-white/10 rounded-2xl backdrop-blur-xl shadow-2xl">
            <div class="flex items-center gap-2 text-xs font-medium text-text-muted">
                <span class="text-amber-400 font-bold">*</span>
                <span>Required fields must be completed.</span>
            </div>
            <div class="flex items-center gap-3">
                <a routerLink="/hr/leave" class="px-5 py-2.5 bg-bg-tertiary hover:bg-white/5 border border-white/10 text-text-secondary hover:text-text-primary text-xs sm:text-sm font-bold rounded-xl transition-all">
                    Cancel
                </a>
                <button type="submit" [disabled]="isSaving() || !form().staff_id || !form().start_date || !form().end_date"
                    class="px-7 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs sm:text-sm font-bold rounded-xl shadow-lg shadow-blue-600/25 transition-all flex items-center gap-2">
                    @if (isSaving()) {
                        <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        <span>Submitting...</span>
                    } @else {
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                        <span>Submit Application</span>
                    }
                </button>
            </div>
        </div>
    </form>
</div>
