<div class="flex flex-col gap-6 sm:gap-8 animate-fade-in max-w-4xl mx-auto pb-12">

    <!-- Page Header -->
    <div class="flex items-center gap-4">
        <a routerLink="/hr/staff" class="p-2.5 hover:bg-bg-tertiary text-text-muted hover:text-text-primary rounded-2xl border border-white/10 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div class="h-10 w-px bg-white/10"></div>
        <div>
            <h1 class="text-2xl sm:text-3xl font-black tracking-tight text-text-primary">Register Employee</h1>
            <p class="text-xs sm:text-sm text-text-muted mt-0.5">Onboard a new faculty or administrative staff member to the directory</p>
        </div>
    </div>

    <form (submit)="saveStaff($event)" class="flex flex-col gap-6" novalidate>

        <!-- SECTION 1: Personal Information -->
        <div class="bg-gradient-to-b from-bg-secondary to-bg-secondary/90 border border-white/10 rounded-3xl p-6 sm:p-8 flex flex-col gap-6 shadow-2xl relative overflow-hidden">
            <div class="pointer-events-none absolute top-0 right-0 w-64 h-64 bg-blue-500/5 blur-[100px] rounded-full"></div>
            
            <div class="flex items-center gap-3 pb-4 border-b border-white/10">
                <div class="w-10 h-10 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                </div>
                <div>
                    <h2 class="text-sm sm:text-base font-black text-text-primary">Personal Identity</h2>
                    <p class="text-[10px] text-text-muted uppercase tracking-widest font-bold">Staff member legal credentials</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                
                <!-- First Name -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">First Name <span class="text-blue-400">*</span></label>
                    <input type="text" placeholder="e.g. Kwame"
                        [value]="form().first_name || ''"
                        (input)="updateForm('first_name', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 shadow-sm" required>
                </div>

                <!-- Last Name -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Last Name <span class="text-blue-400">*</span></label>
                    <input type="text" placeholder="e.g. Mensah"
                        [value]="form().last_name || ''"
                        (input)="updateForm('last_name', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 shadow-sm" required>
                </div>

                <!-- Email -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Email Address</label>
                    <input type="email" placeholder="faculty@schoollinx.com"
                        [value]="form().email || ''"
                        (input)="updateForm('email', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 shadow-sm">
                </div>

                <!-- Phone Number -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Phone Number</label>
                    <input type="tel" placeholder="e.g. 0244 123 456"
                        [value]="form().phone_number || ''"
                        (input)="updateForm('phone_number', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-mono text-text-primary focus:outline-none focus:border-blue-500/50 shadow-sm">
                </div>

            </div>
        </div>

        <!-- SECTION 2: Employment & Compensation -->
        <div class="bg-gradient-to-b from-bg-secondary to-bg-secondary/90 border border-white/10 rounded-3xl p-6 sm:p-8 flex flex-col gap-6 shadow-2xl relative overflow-hidden">
            <div class="pointer-events-none absolute top-0 right-0 w-64 h-64 bg-emerald-500/5 blur-[100px] rounded-full"></div>
            
            <div class="flex items-center gap-3 pb-4 border-b border-white/10">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </div>
                <div>
                    <h2 class="text-sm sm:text-base font-black text-text-primary">Role, Department & Payroll Details</h2>
                    <p class="text-[10px] text-text-muted uppercase tracking-widest font-bold">Institutional responsibilities & base compensation</p>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
                
                <!-- Job Title -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Job Title <span class="text-emerald-400">*</span></label>
                    <input type="text" placeholder="e.g. Senior Science Master"
                        [value]="form().job_title || ''"
                        (input)="updateForm('job_title', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 shadow-sm" required>
                </div>

                <!-- Department -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Department</label>
                    <div class="relative">
                        <select class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 appearance-none pr-10 shadow-sm cursor-pointer"
                                [value]="form().department || ''"
                                (change)="updateForm('department', $any($event.target).value)">
                            <option value="">— Select Department —</option>
                            @for (dept of departments; track dept) {
                                <option [value]="dept">{{ dept }}</option>
                            }
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-text-muted">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Base Salary -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Base Monthly Salary (GH₵) <span class="text-emerald-400">*</span></label>
                    <input type="number" placeholder="0.00" min="0" step="0.01"
                        [value]="form().base_salary || 0"
                        (input)="updateForm('base_salary', +$any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-mono text-text-primary focus:outline-none focus:border-blue-500/50 shadow-sm" required>
                </div>

                <!-- Hire Date -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Hire Date <span class="text-emerald-400">*</span></label>
                    <input type="date" 
                        [value]="form().hire_date || ''"
                        (input)="updateForm('hire_date', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-medium text-text-primary focus:outline-none focus:border-blue-500/50 [color-scheme:dark] shadow-sm" required>
                </div>

                <!-- Bank Account -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="text-xs font-bold text-text-primary uppercase tracking-wider">Bank Account Number / Mobile Money Wallet</label>
                    <input type="text" placeholder="e.g. GCB Bank - 1234567890 or 0244123456"
                        [value]="form().bank_account || ''"
                        (input)="updateForm('bank_account', $any($event.target).value)"
                        class="w-full px-4 py-3.5 bg-bg-tertiary border border-white/10 rounded-2xl text-sm font-mono text-text-primary focus:outline-none focus:border-blue-500/50 shadow-sm">
                </div>

            </div>
        </div>

        <!-- Sticky Action Footer -->
        <div class="sticky bottom-4 z-20 flex items-center justify-between p-4 sm:p-5 bg-bg-secondary/90 border border-white/10 rounded-2xl backdrop-blur-xl shadow-2xl">
            <div class="flex items-center gap-2 text-xs font-medium text-text-muted">
                <span class="text-blue-400 font-bold">*</span>
                <span>Required fields must be completed.</span>
            </div>
            <div class="flex items-center gap-3">
                <a routerLink="/hr/staff" class="px-5 py-2.5 bg-bg-tertiary hover:bg-white/5 border border-white/10 text-text-secondary hover:text-text-primary text-xs sm:text-sm font-bold rounded-xl transition-all">
                    Cancel
                </a>
                <button type="submit" [disabled]="isSaving() || !form().first_name || !form().last_name || !form().job_title"
                    class="px-7 py-2.5 bg-blue-600 hover:bg-blue-500 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs sm:text-sm font-bold rounded-xl shadow-lg shadow-blue-600/25 transition-all flex items-center gap-2">
                    @if (isSaving()) {
                        <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                        <span>Registering...</span>
                    } @else {
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                        <span>Save Employee Profile</span>
                    }
                </button>
            </div>
        </div>
    </form>
</div>
